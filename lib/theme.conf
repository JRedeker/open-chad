# ============================================
# OPEN-CHAD: ayu-dark Theme
# ============================================
# Palette (ayu-dark):
#   bg=#0D1017  fg=#BFBDB6  accent=#E6B450
#   string=#AAD94C  func=#FFB454  type=#59C2FF
#   keyword=#FF8F40  comment=#626d7a
#   line=#161A24  border=#1B1F29
# Layout:  Row 0 = context + tabs + clock
#          Row 1 = thin accent rule + centered title
# Edges:   build=#59C2FF → plan=#FFB454 → scout=#F07178 → refine=#AAD94C
#          Row 0: █▌▌▌ left  ▐▐▐█ right  (light: solid open, thin strip, solid close)
#          Row 1: █▌▌▌▌ left  ▐▐▐█ right  (bold: double-block open, thin strip, solid close)

# --- STATUS BAR: 2-line unified layout ---
set -g status 2
set -g status-position bottom
set -g status-style 'bg=#0D1017,fg=#BFBDB6'
set -g status-interval 10

# --- ROW 0: CONTEXT + TABS + CLOCK ---
# Left: synthwave light cap — solid block open + thin color strip
set -g status-left '#[bg=#0D1017]#(~/dev/open-chad/lib/status_edges.sh left row0 "#{session_name}")#[bg=#0D1017] #[nobold,fg=#626d7a]#{window_name} #[fg=#1B1F29]│ #[nobold]#(~/dev/open-chad/lib/session_title.sh "#{pane_current_path}" "#{session_name}") '
set -g status-left-length 120

# Right: Clock + date + thin color strip + dim block close
set -g status-right '#[bg=#0D1017,fg=#626d7a]%H:%M #[fg=#1B1F29]│ #[fg=#626d7a]%d-%b #(~/dev/open-chad/lib/status_edges.sh right row0 "#{session_name}")'
set -g status-right-length 40

# Center tabs between context and clock
set -g status-justify centre

# Inactive tabs: comment gray, spacious
set -g window-status-format '#[fg=#626d7a,bg=#0D1017]  #I  '

# Active tab: foreground on lifted bg
set -g window-status-current-format '#[fg=#1B1F29,bg=#0D1017] ▎#[bold,fg=#BFBDB6,bg=#161A24] #I #[nobold,fg=#1B1F29,bg=#0D1017]▎ '

# Tab separator
set -g window-status-separator '#[fg=#1B1F29] '

# --- ROW 1: REPO/BRANCH + SYSTEM RESOURCES + LLM GAUGES ---
# Left: synthwave bold cap — double block open + full color strip | Right: script (CPU/RAM/Load + gauges + bold close)
set -g 'status-format[1]' '#[align=left,bg=#0D1017]#(~/dev/open-chad/lib/status_edges.sh left row1 "#{session_name}")#[bg=#0D1017] #[nobold]#(~/dev/open-chad/lib/status_left.sh "#{pane_current_path}") #[align=right,nobold]#(~/dev/open-chad/lib/status_right.sh "#{session_name}")'

# --- PANE BORDERS ---
# Default border color — overridden per-session by bin/openchad to match the
# randomized color picked by pane_border.sh (same djb2 hash from session name).
set -g pane-active-border-style 'fg=#59C2FF'
set -g pane-border-style 'fg=#161A24'
set -g pane-border-lines heavy
set -g pane-border-status top
# Pane border: per-session randomized color + decorative pattern via pane_border.sh.
# The script picks a color from the agent palette and a glyph pattern using the
# session name hash (same technique as status_edges.sh). Inactive panes stay dim.
set -g pane-border-format '#(~/dev/open-chad/lib/pane_border.sh "#{pane_current_path}" "#{session_name}" "#{pane_active}" "#{pane_width}")'

# --- ACTIVITY ---
set -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style 'fg=#FFB454,bg=#0D1017,bold'

# --- WINDOW NAME PROTECTION ---
set -g allow-rename off
set -g automatic-rename off

# --- QUICK TOOLS ---
# Prefix+m opens OMP as a modal popup inside tmux.
# -EE: close on success, keep failures visible.
# Override default 80%x80% via OPEN_CHAD_OMP_POPUP_SIZE (see lib/omp_popup.sh).
if-shell -F '#{>=:#{version},3.2}' \
  'bind m run-shell "~/dev/open-chad/lib/omp_popup.sh"' \
  'bind m display-message "open-chad: tmux >= 3.2 required for omp popup"'
