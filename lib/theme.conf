# ============================================
# OPEN-CHAD: Muted 80s Retro Theme
# ============================================
# Palette: sage(107) gold(186) coral(173) brick(131) lavender(139) steel(67)
# Layout:  Row 0 = context + tabs + clock
#          Row 1 = thin rainbow rule + centered title

# --- STATUS BAR: 2-line unified layout ---
set -g status 2
set -g status-position bottom
set -g status-style 'bg=colour234,fg=colour250'
set -g status-interval 5

# --- ROW 0: CONTEXT + TABS + CLOCK ---
# Left: Grouped ▌ retro edges, neutral gray text
set -g status-left '#[bg=colour234,fg=colour107]▌#[fg=colour186]▌#[fg=colour173]▌#[fg=colour131]▌#[bg=colour234] #[bold,fg=colour250]#{pane_current_command} #[nobold,fg=colour238]│ #[fg=colour245]#{b:pane_current_path} #[fg=colour238]│ #[fg=colour245]#(git -C "#{pane_current_path}" branch --show-current 2>/dev/null || echo "–") '
set -g status-left-length 65

# Right: Neutral clock, Grouped ▐ retro edges
set -g status-right '#[bg=colour234,fg=colour245]%H:%M #[fg=colour238]│ #[fg=colour245]%d-%b #[fg=colour131]▐#[fg=colour173]▐#[fg=colour186]▐#[fg=colour107]▐'
set -g status-right-length 35

# Center tabs between context and clock
set -g status-justify centre

# Inactive tabs: grayscale, spacious
set -g window-status-format '#[fg=colour242,bg=colour234]  #I:#W  '

# Active tab: clean grayscale highlight
set -g window-status-current-format '#[fg=colour238,bg=colour234] ▎#[bold,fg=colour250,bg=colour236] #I:#W #[nobold,fg=colour238,bg=colour234]▎ '

# Tab separator
set -g window-status-separator '#[fg=colour238] '

# --- ROW 1: TITLE + SMART CONTEXT ---
# Left: Grouped ▌ edges + ADV title | Right: Neutral metrics + Grouped ▐ edges
set -g 'status-format[1]' '#[align=left,bg=colour233]#[fg=colour107]▌#[fg=colour186]▌#[fg=colour173]▌#[fg=colour131]▌#[bg=colour233] #[nobold]#(~/dev/open-chad/lib/title_parser.sh "#{window_name}") #[align=right,nobold,fg=colour245]#(~/dev/open-chad/lib/status_right.sh "#{pane_current_path}")'

# --- PANE BORDERS ---
set -g pane-active-border-style 'fg=colour107'
set -g pane-border-style 'fg=colour236'
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format '#[align=centre]#{?pane_active,#[fg=colour107] #{pane_current_command} ,#[fg=colour238] #{pane_current_command} }'

# --- ACTIVITY ---
set -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style 'fg=colour180,bg=colour234,bold'

# --- WINDOW NAME PROTECTION ---
set -g allow-rename off
set -g automatic-rename off
