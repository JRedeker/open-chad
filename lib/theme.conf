# ============================================
# OPEN-CHAD: ayu-dark Theme
# ============================================
# Palette (ayu-dark):
#   bg=#0D1017  fg=#BFBDB6  accent=#E6B450
#   string=#AAD94C  func=#FFB454  type=#59C2FF
#   keyword=#FF8F40  comment=#626d7a
#   line=#161A24  border=#1B1F29
# Layout:  Row 0 = context + tabs + clock
#          Row 1 = thin accent rule + centered title

# --- STATUS BAR: 2-line unified layout ---
set -g status 2
set -g status-position bottom
set -g status-style 'bg=#0D1017,fg=#BFBDB6'
set -g status-interval 5

# --- ROW 0: CONTEXT + TABS + CLOCK ---
# Left: Grouped ▌ ayu accent edges, neutral text
set -g status-left '#[bg=#0D1017,fg=#AAD94C]▌#[fg=#E6B450]▌#[fg=#59C2FF]▌#[fg=#FF8F40]▌#[bg=#0D1017] #[bold,fg=#BFBDB6]#(basename "$(git -C "#{pane_current_path}" rev-parse --show-toplevel 2>/dev/null)" 2>/dev/null || echo "#{b:pane_current_path}") #[nobold,fg=#1B1F29]│ #[fg=#626d7a]#(git -C "#{pane_current_path}" branch --show-current 2>/dev/null || echo "–") '
set -g status-left-length 75

# Right: Neutral clock, Grouped ▐ ayu accent edges
set -g status-right '#[bg=#0D1017,fg=#626d7a]%H:%M #[fg=#1B1F29]│ #[fg=#626d7a]%d-%b #[fg=#FF8F40]▐#[fg=#59C2FF]▐#[fg=#E6B450]▐#[fg=#AAD94C]▐'
set -g status-right-length 35

# Center tabs between context and clock
set -g status-justify centre

# Inactive tabs: comment gray, spacious
set -g window-status-format '#[fg=#626d7a,bg=#0D1017]  #I:#W  '

# Active tab: foreground on lifted bg
set -g window-status-current-format '#[fg=#1B1F29,bg=#0D1017] ▎#[bold,fg=#BFBDB6,bg=#161A24] #I:#W #[nobold,fg=#1B1F29,bg=#0D1017]▎ '

# Tab separator
set -g window-status-separator '#[fg=#1B1F29] '

# --- ROW 1: TITLE + SMART CONTEXT ---
# Left: Grouped ▌ edges + ADV title | Right: Neutral metrics + Grouped ▐ edges
set -g 'status-format[1]' '#[align=left,bg=#0D1017]#[fg=#AAD94C]▌#[fg=#E6B450]▌#[fg=#59C2FF]▌#[fg=#FF8F40]▌#[bg=#0D1017] #[nobold]#(~/dev/open-chad/lib/title_parser.sh "#{window_name}") #[align=right,nobold,fg=#626d7a]#(~/dev/open-chad/lib/status_right.sh "#{pane_current_path}")'

# --- PANE BORDERS ---
set -g pane-active-border-style 'fg=#AAD94C'
set -g pane-border-style 'fg=#161A24'
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format '#[align=centre]#{?pane_active,#[fg=#AAD94C] #(basename "$(git -C "#{pane_current_path}" rev-parse --show-toplevel 2>/dev/null)" 2>/dev/null || echo "#{b:pane_current_path}") ,#[fg=#1B1F29] #(basename "$(git -C "#{pane_current_path}" rev-parse --show-toplevel 2>/dev/null)" 2>/dev/null || echo "#{b:pane_current_path}") }'

# --- ACTIVITY ---
set -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style 'fg=#FFB454,bg=#0D1017,bold'

# --- WINDOW NAME PROTECTION ---
set -g allow-rename off
set -g automatic-rename off
